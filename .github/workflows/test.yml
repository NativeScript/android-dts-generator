name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/typecheck/package-lock.json

      - name: Build the generator
        working-directory: dts-generator
        run: ./gradlew jar

      - name: Compare with the expected output
        run: make test

      - name: Type-check the expected output
        run: make test-typecheck
